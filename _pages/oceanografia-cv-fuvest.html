<!doctype html>

<head>
<meta charset="utf-8">

<meta name="robots" content="noindex, nofollow">
<title>Oceanografia USP – C/V Fuvest</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; color: #222; background: #fff; }
  .legenda { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12px; color: #555; margin-bottom: 8px; }
  .legenda span { display: flex; align-items: center; gap: 6px; }
  .caixa { position: relative; width: 100%; max-width: 900px; height: 380px; }
</style>
</head>
<body>
<h3>Oceanografia USP – relação candidato/vaga na Fuvest, 2002–2027</h3>
<div class="legenda">
  <span><span style="width:10px;height:10px;border-radius:50%;background:#2a78d6"></span>Total</span>
  <span><span style="width:10px;height:10px;background:#eb6834"></span>Ampla concorrência</span>
  <span><span style="width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:10px solid #1baf7a"></span>Escola pública</span>
  <span><span style="width:9px;height:9px;background:#6250d6;transform:rotate(45deg)"></span>PPI</span>
</div>
<div class="caixa"><canvas id="cv"></canvas></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
// Dados: serie_extraida.csv (gerado por extrair_oceanografia.py). null = sem dado.
const anos = Array.from({length: 26}, (_, i) => String(2002 + i));
const N = null, pre = Array(17).fill(N);   // modalidades so a partir de 2019

const serie = (label, data, cor, marcador, traco) => ({
  label, data, borderColor: cor, backgroundColor: cor,
  pointStyle: marcador, pointRadius: marcador === 'triangle' ? 6 : 5,
  pointBorderColor: '#fff', pointBorderWidth: 1.5,
  borderWidth: 2, borderDash: traco, spanGaps: false, tension: 0
});

new Chart(document.getElementById('cv'), {
  type: 'line',
  data: { labels: anos, datasets: [
    serie('Total', [15.3,N,N,21.98,17.6,12.53,N,N,N,N,7.45,6.97,7.65,7.45,8.07,8.29,7.39,
                    6.21,6.75,5.86,4.39,4.25,3.48,4.34,3.76,5.24], '#2a78d6', 'circle', []),
    serie('Ampla concorrência', pre.concat([6.33,6.72,6.44,4.88,4.44,3.61,4.94,3.44,5.39]),
          '#eb6834', 'rect', [6,4]),
    serie('Escola pública', pre.concat([8.17,7.29,6.38,4.75,5.00,4.00,4.43,5.00,5.86]),
          '#1baf7a', 'triangle', [2,3]),
    serie('PPI', pre.concat([2.75,5.67,2.50,1.75,2.00,2.00,1.50,3.00,3.50]),
          '#6250d6', 'rectRot', [8,3,2,3])
  ]},
  options: {
    responsive: true, maintainAspectRatio: false,
    interaction: { mode: 'index', intersect: false },
    plugins: {
      legend: { display: false },
      tooltip: { callbacks: { label: c => c.raw == null ? null :
        `${c.dataset.label}: ${c.raw.toFixed(1).replace('.', ',')}` } }
    },
    scales: {
      x: { grid: { display: false }, ticks: { autoSkip: false, maxRotation: 60 } },
      y: { min: 0, title: { display: true, text: 'Candidatos por vaga' } }
    }
  }
});
</script>
</body>
</html>
